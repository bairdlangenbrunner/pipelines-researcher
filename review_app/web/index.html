<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pipelines reviewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>pipelines reviewer</h1>
  <span id="scope" class="scope"></span>
  <div class="who"><span id="whoami"></span>
    <button id="summary-btn" class="ghost" hidden>summary</button>   <!-- off for now: flip SHOW_SUMMARY in app.js to bring it back -->
    <button id="sync" class="ghost" hidden>&#8635; refresh backend</button>
    <button id="push" class="ghost" hidden data-tip="write the accepted changes into the backend sheet">&#8682; push changes</button>
    <select id="theme-pick" aria-label="color theme">
      <option value="">default</option><option value="solarized">solarized</option><option value="nord">nord</option>
      <option value="gruvbox">gruvbox</option><option value="dracula">dracula</option><option value="sepia">sepia</option>
    </select>
    <button id="theme" class="ghost" aria-label="toggle light / dark">&#9680;</button>
    <button id="progress-btn" class="ghost" aria-label="progress">progress</button>
    <button id="info-btn" class="ghost" aria-label="how this works">how to</button>
    <button id="help-btn" class="ghost" aria-label="keyboard shortcuts">?</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<section id="tab-queue" class="tabpanel">
  <form id="filters" class="filters" onsubmit="return false">
    <div class="row2">
      <span id="f-fuel" class="countries" role="group" aria-label="fuel"></span>
      <span id="f-country" class="countries" role="group" aria-label="country" hidden></span>
      <label>decision <select id="f-decision"></select></label>
      <label>kind <select id="f-kind"></select></label>
      <label data-tip="major: the data point moves (fill, clear, change, status, route, new row); minor: the value stands and only references are added">severity <select id="f-severity"></select></label>
      <label>confidence <select id="f-tier"></select></label>
      <label class="grow">search <input type="search" id="f-q" placeholder="name / project id / country"></label>
    </div>
    <div class="row2">
      <label class="check" data-tip="changes whose value and refs the snapshot already holds are left out of the queue unless this is ticked"><input type="checkbox" id="f-landed" aria-description="changes the snapshot already holds are left out of the queue unless this is ticked"> show changes already in the backend</label>
      <button type="button" id="f-more" class="ghost" aria-expanded="false" aria-controls="more-filters">more filters</button>
      <button type="button" id="f-reset" class="ghost">reset</button>
    </div>
    <div id="more-filters" class="more-filters" hidden>
      <label>class <select id="f-class_out"><option value="">any</option></select></label>
      <label>column <select id="f-column"><option value="">any</option></select></label>
      <label>batch <select id="f-dir"><option value="">any</option></select></label>
      <label>decided by <select id="f-by"><option value="">anyone</option></select></label>
      <label class="check" data-tip="decided changes whose backend cells have changed since the call was made"><input type="checkbox" id="f-drift" aria-description="decided changes whose backend cells have changed since the call was made"> sheet changed since decided</label>
      <label class="check" data-tip="validity concerns no change answers: nothing is proposed on the columns they question (selects the concern kind)"><input type="checkbox" id="f-contested" aria-description="validity concerns no change answers: nothing is proposed on the columns they question"> unanswered concerns</label>
      <label class="check"><input type="checkbox" id="f-owners"> owners tab</label>
    </div>
    <div id="active-filters" class="active-filters" hidden></div>
  </form>
  <div class="queue">
    <ol id="pipes" class="pipes" aria-label="pipelines"></ol>
    <article id="card" class="card" aria-live="polite"></article>
  </div>
</section>

<dialog id="dialog"></dialog>

<script src="gas.js"></script>
<script src="app.js"></script>
</body>
</html>
