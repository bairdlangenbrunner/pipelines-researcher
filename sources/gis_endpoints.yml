# Public GIS endpoints for route-creation rung 2 (fetch_arcgis.py / fetch_overpass.py).
#
# Registry of public vector sources for pipeline geometry. Each entry documents a
# real, public portal; the exact numbered layer URL (`url`) is filled in once
# verified at run time — we do NOT commit a guessed FeatureServer path (standing
# rule: never fabricate source URLs). When you confirm a working layer URL during a
# run, paste it into `url` here and add a one-line note in docs/reference/source_roster.md.
#
# Fields:
#   kind      : arcgis | overpass | download (static file: georeferenced blueprint/shapefile bundle)
#   url       : numbered layer URL (.../FeatureServer/0). Empty = discover + verify first.
#   portal    : human landing page to discover the layer from (real, verified).
#   coverage  : geographic/commodity scope
#   commodities: [oil, gas, ngl, ...] or [all]
#   license   : usage terms as published (verify before shipping any geometry)
#   notes     : discovery hints, gotchas, transfer limits

rrc_pipelines:
  kind: arcgis
  url: "https://gis.rrc.texas.gov/server/rest/services/rrc_public/RRC_Public_Viewer_Srvs/MapServer/14"
  portal: "https://www.rrc.texas.gov/resource-center/research/gis-viewer/"
  coverage: "Texas, USA — intrastate pipelines"
  commodities: [oil, gas, ngl]
  license: "US public record (Texas RRC) — verify terms of use"
  notes: >
    Texas Railroad Commission publishes pipeline layers via ArcGIS REST. Find the
    FeatureServer/MapServer layer from the GIS viewer's network tab, confirm it
    returns f=geojson & outSR=4326, then set `url`. High-density state; use --bbox
    or a county --where to stay under --max-features.
    Verified 2026-10-20: layer 14 "Pipelines" (polyline, 1000 records per page) answers
    /query with f=geojson and outSR=4326. Fields include OPERATOR, SYSTEM_NAME,
    SUBSYSTEM_NAME, DIAMETER, T4PERMIT, T4PERMIT_MILES, COMMODITY, INTERSTATE, STATUS,
    COUNTY_NAME. Select by T4PERMIT (the T-4 permit number) or OPERATOR plus SUBSYSTEM_NAME.
    The bare layer URL returns 403 to url_verifier.py; the query URL returns data.

boem_pipelines:
  kind: arcgis
  url: ""
  portal: "https://www.data.boem.gov/Mapping/Files/PipelinesArcGIS.html"
  coverage: "US Gulf of Mexico OCS — offshore pipelines"
  commodities: [oil, gas]
  license: "US federal public domain (BOEM) — verify"
  notes: >
    BOEM offshore pipeline geometry. Offshore lines: expect the landfall/endpoint
    checks in validate_route_candidate.py to run in offshore-lenient mode.

# NPMS (npms.phmsa.dot.gov) is intentionally NOT an arcgis entry: the National
# Pipeline Mapping System blocks bulk/programmatic export (public viewer is
# one-county-at-a-time, no REST query). Use it as a human cross-check only.

israel_itur_tabot:
  kind: download
  url: "https://apps.land.gov.il/IturTabotData/download/jerus/<planID>.zip"
  portal: "https://apps.land.gov.il/IturTabotData/"
  coverage: "Israel — statutory plan (תב\"ע/תמ\"א) blueprints incl. gas pipeline strips"
  commodities: [gas, oil]
  license: "Israel Land Registry public record — verify terms before shipping geometry"
  notes: >
    Israel Land Registry plan-document store. Per plan ID, /takanonim/<bucket>/<id>.pdf
    (regulations), /tabot/<bucket>/<id>/… (blueprint sheets), and /download/<bucket>/<id>.zip
    (GIS bundle: scanned sheet JPG + JGW world file in EPSG:2039 ITM — exact georeferencing,
    no GCP fit needed). The <bucket> (e.g. "jerus") is a file-tree label, not geographic.
    Verified 2026-07-23 on plan 1053432 (TAMA 37/A/2/7, Ashdod–Ashkelon gas line): 0.42–1.02
    m/px sheets; the green pipeline strip (רצועת צנרת) segments cleanly by color. Discover
    plan IDs via mavat.iplan.gov.il or tabanow.co.il, then verify each URL. iplan MapServer
    layers return attributes but geometry is disabled server-side — this store is the
    workaround.

osm_overpass:
  kind: overpass
  url: ""                       # not used for overpass; fetch_overpass.py takes --area/--bbox
  portal: "https://www.openstreetmap.org/"
  coverage: "worldwide — man_made=pipeline ways/relations"
  commodities: [all]
  license: "ODbL — © OpenStreetMap contributors (Baird's licensing call at review)"
  notes: >
    Not a per-layer URL — driven by fetch_overpass.py --area/--bbox --substance.
    Every feature ships with source=OSM/license=ODbL provenance; whether ODbL
    geometry can enter a GEM tracker is decided at review, never assumed.

ferc_elibrary:
  kind: download
  url: "https://elibrary.ferc.gov/eLibrarywebapi/api/File/DownloadP8File"
  portal: "https://elibrary.ferc.gov/eLibrary/search"
  coverage: "US interstate gas pipelines, storage and LNG: FERC docket filings (applications, resource reports, environmental assessments and their route figures)"
  commodities: [gas]
  license: "US federal public record; public (availCode P) documents only, never CEII alignment sheets"
  notes: >
    The eLibrary web pages are a JavaScript app, but its JSON API answers plain POSTs (verified 2026-10-20 on dockets CP25-531 and CP26-19).
    Search: POST https://elibrary.ferc.gov/eLibrarywebapi/api/Search/AdvancedSearch with a JSON body carrying docketSearches [{docketNumber, subDocketNumbers: []}], searchText and resultsPerPage; each hit gives acesssionNumber (sic), availCode and transmittals[].fileId.
    Download: POST the url above with {"FileType":"","accession":"","fileid":0,"FileIDAll":"","fileidLst":["<fileId>"],"Islegacy":false}; it returns the raw file.
    Route figures are usually in Resource Report 1 or the environmental assessment; render pages with pdftoppm.
    Resource Report figures are often GeoPDFs: a page whose object has /VP with a /Measure dictionary (GPTS corner lat/lon, LPTS, a WKT projection) carries the drawn route as a real vector path, so read it with PyMuPDF get_drawings() and the page's own georeferencing instead of tracing (worked example, P8327 2026-10-20: batches/united-states-gas/staging/route-creation-p8327-20261020/traces/extract_geopdf.py). Cut such a page out with doc.select([n]), which keeps /VP; insert_pdf drops it.
    The citable form is https://elibrary.ferc.gov/eLibrary/filedownload?fileid=<fileId>. That page is a JavaScript shell, but url_verifier.py (since 2026-10-20) reads the file itself through the download API above, so these links verify like any PDF. Name the accession number in notes too.
